name: CI

on:
  push:
  pull_request:

jobs:
  study-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Compile study scripts
        run: python -m compileall -q scripts analysis
      - name: Guard against committed private artifacts
        run: |
          if git ls-files | grep -E '(^|/)(vault|private)/|\.private\.|construct_review_[ABC]\.csv|response_review_[ABC]\.csv|response_adjudication_C\.csv'; then
            echo "Private/reviewer artifact tracked in Git" >&2
            exit 1
          fi
