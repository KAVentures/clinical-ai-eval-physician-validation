# Proposed September 2026 panel. Exact IDs were checked against current vendor
# documentation on 2026-09-04. Dry-run every credential/endpoint before freezing.
#
# There are TWO locks:
# - authoring_frozen: lock perturbation author + prompt before the full draft reservoir;
# - frozen: lock targets + judges before any primary target-model call.

authoring_frozen: false
frozen: false
verified_on: "2026-09-04"

authoring_model:
  provider: openai
  model: gpt-5.6-luna
  reasoning_effort: medium
  role: perturbation_draft_author_only

target_models:
  - target_id: openai_gpt56_sol
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: medium
    tools: disabled
  - target_id: anthropic_opus5
    provider: anthropic
    model: claude-opus-5
    reasoning_effort: high
    tools: disabled
  - target_id: google_gemini31pro
    provider: google
    model: gemini-3.1-pro-preview
    reasoning_effort: high
    tools: disabled
  - target_id: xai_grok46
    provider: xai
    model: grok-4.6
    reasoning_effort: medium
    tools: disabled

primary_judges:
  - judge_id: anthropic_opus5_blinded
    provider: anthropic
    model: claude-opus-5
    mode: blinded
    reasoning_effort: high
  - judge_id: google_gemini31pro_blinded
    provider: google
    model: gemini-3.1-pro-preview
    mode: blinded
    reasoning_effort: high
  - judge_id: xai_grok46_blinded
    provider: xai
    model: grok-4.6
    mode: blinded
    reasoning_effort: high

secondary_judges:
  - judge_id: openai_gpt56_sol_blinded_sensitivity
    provider: openai
    model: gpt-5.6-sol
    mode: blinded
    reasoning_effort: high
  - judge_id: anthropic_opus5_cued
    provider: anthropic
    model: claude-opus-5
    mode: rubric_aware
    reasoning_effort: high
  - judge_id: google_gemini31pro_cued
    provider: google
    model: gemini-3.1-pro-preview
    mode: rubric_aware
    reasoning_effort: high
  - judge_id: xai_grok46_cued
    provider: xai
    model: grok-4.6
    mode: rubric_aware
    reasoning_effort: high

inference_policy:
  temperature: null
  tools: disabled
  max_attempts: 4
  retry_backoff_seconds: 1.0
  timeout_seconds: 180
  author_max_output_tokens: 4500
  target_max_output_tokens: 3500
  judge_max_output_tokens: 2500
  judge_format_attempts: 2
  note: >-
    OpenAI and xAI use their Responses APIs; Anthropic uses Messages; Google uses
    generateContent. Reasoning effort is passed exactly where independently
    verified. Gemini 3.1 Pro uses explicit thinkingLevel=high. Every call records a
    request hash, configured and provider-resolved model, endpoint, HTTP status,
    attempt count, timing, and usage. No web/search/tools are enabled.
