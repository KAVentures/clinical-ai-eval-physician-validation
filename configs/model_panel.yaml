# THE ONE PLACE THE STUDY'S MODELS ARE CHOSEN. Change a model by editing its
# `provider` / `model` / `reasoning_effort` here; no code changes are needed.
# Full guide: docs/CHOOSING_MODELS.md. After any edit:
#   python scripts/validate_panel.py    # offline, free
#   python scripts/list_models.py       # free: is each ID offered to your key?
#   python scripts/smoke_test_providers.py   # one tiny paid call per model
# Model IDs below are the proposed panel; confirm each with list_models.py
# immediately before freezing, and switch to a newer ID there if one exists.
#
# The study validates Clinical-AI-Eval's scoped clinician-facing measurement layer.
# Target models are test subjects. Physicians are the clinical reference.
# Grok 4.6 is the ONE prespecified automated judge implementation.
#
# There are TWO locks:
# - authoring_frozen: freeze perturbation author + prompt before full drafting;
# - frozen: freeze targets + automated judge before any primary target-model call.

authoring_frozen: false
frozen: false
verified_on: "2026-09-04"

# Built-in providers: openai, anthropic, google, xai. Define any other provider
# here and refer to it by name below. `api` is one of:
#   openai_responses | anthropic_messages | google_generate_content | openai_chat_completions
# openai_chat_completions covers any OpenAI-compatible server (DeepSeek, Mistral,
# OpenRouter, Together, Fireworks, a gateway, or a local vLLM/Ollama server).
# `vendor` is the model's developer; it drives the same-developer judge audit and
# the distinct-developer rule for targets (an aggregator is not a developer).
providers: {}
#  deepseek:
#    api: openai_chat_completions
#    base_url: https://api.deepseek.com/v1
#    api_key_env: DEEPSEEK_API_KEY
#    vendor: deepseek
#  local_vllm:                      # open-weight judge for a sensitivity analysis
#    api: openai_chat_completions
#    base_url: http://localhost:8000/v1
#    api_key_env: null              # no key
#    effort_param: null             # server takes no reasoning_effort field
#    vendor: open_weight
#  openrouter:
#    api: openai_chat_completions
#    base_url: https://openrouter.ai/api/v1
#    api_key_env: OPENROUTER_API_KEY
#    # set `vendor:` on each model entry routed through it
# A built-in can be overridden field by field, e.g. a regional base_url:
#  anthropic:
#    base_url: https://my-gateway.example.org/anthropic/v1

# Shape of the design. The scripts enforce these, whatever models are chosen.
design:
  target_count: 4
  distinct_target_vendors: true
  primary_judge_count: 1

authoring_model:
  provider: openai
  model: gpt-5.6-luna
  reasoning_effort: medium
  role: perturbation_draft_author_only

target_models:
  - target_id: openai_gpt56_sol
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: medium
    tools: disabled
  - target_id: anthropic_opus55
    provider: anthropic
    model: claude-opus-5-5         # current Opus (succeeds claude-opus-5)
    reasoning_effort: high         # set explicitly: Opus 5.5 defaults to medium
    tools: disabled
  - target_id: google_gemini31pro
    provider: google
    model: gemini-3.1-pro-preview
    reasoning_effort: high
    tools: disabled
  - target_id: xai_grok46
    provider: xai
    model: grok-4.6
    reasoning_effort: medium
    tools: disabled

primary_judges:
  - judge_id: xai_grok46_blinded
    provider: xai
    model: grok-4.6
    mode: blinded
    reasoning_effort: high

# No proprietary judge panel is part of the confirmatory study.
# An open-weight clinical judge may be added only as a prespecified secondary
# sensitivity analysis if it is public, version-pinnable and reproducible before
# study lock. If not, the study proceeds with no replacement.
secondary_judges: []

framework_validation_thresholds:
  automated_judge_sensitivity_min: 0.80
  automated_judge_specificity_min: 0.80
  construct_confirmation_min: 0.80
  provenance: >-
    Inherited prospectively from Clinical-AI-Eval's pre-existing default validation
    protocol: defect-detection sensitivity >=0.80 and false-alert rate <=0.20.
    Confidence intervals are reported and the manuscript will not equate a threshold
    crossing with deployment readiness.

automated_judge_selection:
  rationale: >-
    The predecessor Grok 4.3 showed the strongest point-estimate clinician alignment
    and least permissive calibration among four judges in prior physician-anchored
    work by the investigator, while no model was shown to be universally unbiased.
    Grok 4.6 is therefore selected prospectively as one representative current
    automated evaluator and is revalidated against new blinded physician labels
    rather than assumed to inherit Grok 4.3 calibration.
  same_provider_audit_required: true
  primary_scoring_scope: physician_calibration_only
  expected_primary_cells: 480

inference_policy:
  temperature: null
  tools: disabled
  max_attempts: 4
  retry_backoff_seconds: 1.0
  timeout_seconds: 600
  author_max_output_tokens: 16000
  target_max_output_tokens: 16000
  judge_max_output_tokens: 12000
  judge_format_attempts: 3
  note: >-
    OpenAI and xAI use their Responses APIs; Anthropic uses Messages; Google uses
    generateContent. Reasoning effort is passed exactly where independently
    verified. Gemini 3.1 Pro uses explicit thinkingLevel=high. Every call records a
    request hash, configured and provider-resolved model, endpoint, HTTP status,
    attempt count, finish reason, timing, and usage. Output caps are deliberately
    generous because reasoning tokens count toward some providers' output limits.
    A judge answer that cannot be parsed is re-asked up to judge_format_attempts
    times in total; a parseable answer is never re-asked, so retries reduce missing
    measurements without letting anyone pick among labels. No provider-side model
    fallback is requested: a refusal is the configured model's outcome. No
    web/search/tools are enabled.
