# September 2026 execution configuration.
# Exact model IDs must be dry-run against live provider APIs immediately before lock.
#
# The study validates Clinical-AI-Eval's scoped clinician-facing measurement layer.
# Target models are test subjects. Physicians are the clinical reference.
# Grok 4.6 is the ONE prespecified automated judge implementation.
#
# There are TWO locks:
# - authoring_frozen: freeze perturbation author + prompt before full drafting;
# - frozen: freeze targets + automated judge before any primary target-model call.

authoring_frozen: false
frozen: false
verified_on: "2026-09-04"

authoring_model:
  provider: openai
  model: gpt-5.6-luna
  reasoning_effort: medium
  role: perturbation_draft_author_only

target_models:
  - target_id: openai_gpt56_sol
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: medium
    tools: disabled
  - target_id: anthropic_opus5
    provider: anthropic
    model: claude-opus-5
    reasoning_effort: high
    tools: disabled
  - target_id: google_gemini31pro
    provider: google
    model: gemini-3.1-pro-preview
    reasoning_effort: high
    tools: disabled
  - target_id: xai_grok46
    provider: xai
    model: grok-4.6
    reasoning_effort: medium
    tools: disabled

primary_judges:
  - judge_id: xai_grok46_blinded
    provider: xai
    model: grok-4.6
    mode: blinded
    reasoning_effort: high

# No proprietary judge panel is part of the confirmatory study.
# An open-weight clinical judge may be added only as a prespecified secondary
# sensitivity analysis if it is public, version-pinnable and reproducible before
# study lock. If not, the study proceeds with no replacement.
secondary_judges: []

automated_judge_selection:
  rationale: >-
    The predecessor Grok 4.3 showed the strongest point-estimate clinician alignment
    and least permissive calibration among four judges in prior physician-anchored
    work by the investigator, while no model was shown to be universally unbiased.
    Grok 4.6 is therefore selected prospectively as one representative current
    automated evaluator and is revalidated against new blinded physician labels
    rather than assumed to inherit Grok 4.3 calibration.
  same_provider_audit_required: true
  primary_scoring_scope: physician_calibration_only
  expected_primary_cells: 480

inference_policy:
  temperature: null
  tools: disabled
  max_attempts: 4
  retry_backoff_seconds: 1.0
  timeout_seconds: 600
  author_max_output_tokens: 16000
  target_max_output_tokens: 16000
  judge_max_output_tokens: 12000
  judge_format_attempts: 1
  note: >-
    OpenAI and xAI use their Responses APIs; Anthropic uses Messages; Google uses
    generateContent. Reasoning effort is passed exactly where independently
    verified. Gemini 3.1 Pro uses explicit thinkingLevel=high. Every call records a
    request hash, configured and provider-resolved model, endpoint, HTTP status,
    attempt count, timing, and usage. Output caps are deliberately generous because
    reasoning tokens count toward some providers' output limits. Judge parse failure
    is recorded after one scoring attempt rather than triggering a fresh re-judgment.
    No web/search/tools are enabled.
