[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-eval-physician-validation"
version = "0.2.0"
description = "Physician-anchored validation study for perturbation-based clinical AI evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Koyar Afrasyab, M.D." }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "clinical-ai-eval @ git+https://github.com/KAVentures/clinical-ai-eval.git@6fc5b60b6cb1cb68f9748baea65d16f18ddc38c1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["study_runtime*"]
